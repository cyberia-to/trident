vm = "nock"

[runtime]
binding_prefix = "os.nockchain"
account_model = "utxo"
storage_model = "merkle-authenticated"
transaction_model = "proof-based"

[cross_chain]
protocols = []

[status]
level = 1
ext_modules = 0
tests = false
notes = ""
