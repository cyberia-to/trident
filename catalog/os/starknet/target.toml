# Starknet — validity rollup on Ethereum powered by Cairo VM
# https://starknet.io

[os]
name = "starknet"
display_name = "Starknet"
vm = "cairo"

[runtime]
binding_prefix = "os.starknet"
account_model = "account"
storage_model = "key-value"
transaction_model = "signed"

[cross_chain]
protocols = ["ethereum-l2"]

[status]
level = 1
ext_modules = 0
tests = false
notes = ""
